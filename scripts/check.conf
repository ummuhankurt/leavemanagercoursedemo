# scripts/check.conf — the steps behind ./scripts/check (format: scripts/check.conf.example).
# Bootstrap 2026-11-07 · Python 3.13 + uv + FastAPI + SQLite (docs/conventions.md).
#
# GREENFIELD: every step below is PLANNED and commented out — the commands need code, and rule 1
# (no spec, no code) forbids writing it during bootstrap. The walking skeleton (first spec)
# creates pyproject.toml / uv.lock / src / tests and uncomments these lines; its PLAN gate
# carries doctor's per-profile verdict (R-13) and its BUILD runs ./scripts/residue (both profiles).
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene) — what each step could leave:
# - uv run: runs the command in the project venv and exits; no daemon. --frozen: never rewrites
#   uv.lock during check (data rule 5: the run changes nothing for the next run).
# - ruff: single process, no server mode used.  # resource hygiene: no ruff server
# - mypy: plain `mypy`, never `dmypy` (the mypy daemon).  # resource hygiene: no mypy daemon
#   Leaves only .mypy_cache (a cache, not state a test reads).
# - lint-imports: single process.
# - pytest: in-process FastAPI TestClient — no uvicorn, no port, no browser; no pytest-xdist
#   workers. Data: every integration test gets its own SQLite file under pytest's tmp_path,
#   migrated fresh — nothing reaches the next run, also after a run killed halfway.
#   -p no:cacheprovider: no .pytest_cache state carried between runs (e.g. --lf ordering).
# - pip-audit: network lookup, single process; full only (needs network).
# Test-count check (bootstrap 3c): when activated, compare `pytest --collect-only -q` counts for
# unit + integration against the step totals — the marker split must lose no test.
#
# Prerequisites (this machine on 2026-11-07: uv missing, Python 3.10.11 — environment gap, R-13,
# decided at the walking skeleton's PLAN gate):
# requires lint: uv --version
# requires lint: uv python find 3.13
# requires audit: uv --version
#
# Planned steps — fast profile = compile-free quick checks + unit tests (docs/testing.md, Two speeds):
# lint [fast]: uv run --frozen ruff check .
# format [fast]: uv run --frozen ruff format --check .
# types [fast]: uv run --frozen mypy --strict src tests
# architecture [fast]: uv run --frozen lint-imports
# unit [fast]: uv run --frozen pytest -q -p no:cacheprovider -m "not integration"
#
# Full only — same marker inverted, so fast ∪ full = every test (selector, never a list):
# integration: uv run --frozen pytest -q -p no:cacheprovider -m integration
# audit: uv run --frozen pip-audit --skip-editable
