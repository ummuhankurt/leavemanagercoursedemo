# scripts/check.conf — the steps behind ./scripts/check (format: scripts/check.conf.example).
# Bootstrap 2026-11-07 · Python 3.13 + uv + FastAPI + SQLite (docs/conventions.md).
# Activated by spec 0001 (walking skeleton), plan step 4.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene) — what each step could leave:
# - uv run: runs the command in the project venv and exits; no daemon. --frozen: never rewrites
#   uv.lock during check (data rule 5: the run changes nothing for the next run).
# - ruff: single process, no server mode used.  # resource hygiene: no ruff server
#   Scoped to src tests: ruff ≥ 0.17 also formats Markdown, and the ANEW files are not ours to
#   reformat.
# - mypy: plain `mypy`, never `dmypy` (the mypy daemon).  # resource hygiene: no mypy daemon
#   Leaves only .mypy_cache (a cache, not state a test reads).
# - lint-imports: single process.
# - pytest: in-process FastAPI TestClient — no uvicorn, no port, no browser; no pytest-xdist
#   workers; the app lifespan disposes the engine. Data: every test gets its own SQLite file under
#   pytest's tmp_path — nothing reaches the next run, also after a run killed halfway.
#   -p no:cacheprovider: no .pytest_cache state carried between runs.  # resource hygiene: data
# - pip-audit: network lookup, single process; full only (needs network).
#
# Prerequisites (doctor reports which profile this machine can run; unmet → R-13):
requires lint: uv --version
requires lint: uv python find 3.13
requires audit: uv run --frozen python -c "import socket; socket.create_connection(('pypi.org', 443), 5).close()"
#
# Fast profile — quick checks + unit tests (docs/testing.md, Two speeds):
lint [fast]: uv run --frozen ruff check src tests
format [fast]: uv run --frozen ruff format --check src tests
types [fast]: uv run --frozen mypy --strict src tests
architecture [fast]: uv run --frozen lint-imports
unit [fast]: uv run --frozen pytest -q -p no:cacheprovider -m "not integration"
#
# Full only — the same marker inverted, so fast ∪ full = every test (selector, never a list):
integration: uv run --frozen pytest -q -p no:cacheprovider -m integration
audit: uv run --frozen pip-audit --skip-editable
